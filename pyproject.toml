[project]
name = "sbretire"
version = "1.0.0"
description = "Retirement Sustainability Model — Monte Carlo estimate of the maximum sustainable household budget (docs/SPEC.md)"
readme = "README.md"
authors = [{ name = "Todd Badams" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[project.scripts]
sbretire = "sbretire.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "openpyxl>=3.1",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbretire"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers"
markers = [
    "slow: takes > 1 s (large simulation counts)",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (£, π, ≥) in strings/docstrings

[tool.ruff.lint.isort]
known-first-party = ["sbretire"]
known-local-folder = ["scenario_helpers", "cash_flow_doubles", "mortality_fixtures", "backlog_check", "build_ons_mortality", "build_uk_cpi", "calibrate_inflation"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src,scripts"
files = ["src/sbretire", "scripts", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["sbretire"]
branch = true
