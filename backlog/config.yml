project_name: "SBRetire"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Verification", "Done"]
labels: ["spec", "engine", "config", "data", "output", "optimization", "tooling", "docs"]
definition_of_done: ["uv run python scripts/check.py passes (ruff, ruff format, mypy --strict, pytest)", "Unit tests written or updated for all changed production code; SPEC §17 tests covered where the task touches them", "Every acceptance criterion checked off and traceable to a SPEC section", "No tax logic, hard-coded personal assumptions, or live data downloads in src/ (SPEC §2, §4, §16)", "Implementation decisions recorded in backlog/docs/decisions/ when the task resolves a SPEC §18 item", "README / docs/THESAURUS.md / data/README.md updated where behaviour, terms, or data provenance changed"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "code"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
